<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#007f8b">
  <meta name="description" content="نگین AAC؛ سامانه ارتباط جایگزین و افزوده برای کودکان (دری و پشتو)">
  <title>نگین AAC</title>
  <style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  direction: rtl;
  scroll-behavior: smooth;
}

body {
  margin: 0;

  font-family:
    "Tajawal",
    "Noto Sans Arabic",
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #f7fbfc,
      #eef7f8
    );

  color: #17212b;

  min-height: 100vh;
}


/* =========================
   HEADER
========================= */

.header {
  padding: 16px 18px;
  background: linear-gradient(135deg, #007f8b, #00b7c7);
  color: white;
  box-shadow: 0 4px 20px rgba(0, 0, 0, .12);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  min-width: 0;
}

.logo {
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  border-radius: 16px;
  font-size: 30px;
  box-shadow: 0 5px 15px rgba(0,0,0,.15);
  flex-shrink: 0;
}

.header h1 {
  margin: 0;
  font-size: 22px;
  white-space: nowrap;
}

.header p {
  margin: 3px 0 0;
  opacity: .92;
  font-size: 12px;
  line-height: 1.3;
}

.lang-btn {
  border: 2px solid rgba(255,255,255,0.75);
  background: rgba(255,255,255,0.18);
  color: white;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, transform .1s;
  flex-shrink: 0;
}

.lang-btn:active {
  transform: scale(0.95);
  background: rgba(255,255,255,0.32);
}


/* =========================
   CONTAINER
========================= */

.container {

  max-width: 950px;

  margin: auto;

  padding: 15px;
}


/* =========================
   STATUS
========================= */

.status-card {

  display: flex;

  justify-content: space-between;

  align-items: center;

  background: white;

  padding: 12px 16px;

  margin-bottom: 12px;

  border-radius: 18px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.06);

  font-weight: bold;
}


/* =========================
   SENTENCE
========================= */

.sentence-box {

  background: white;

  border-radius: 24px;

  padding: 18px;

  margin-bottom: 15px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.08);
}


.sentence {

  min-height: 70px;

  display: flex;

  align-items: center;

  padding: 14px;

  font-size: 25px;

  font-weight: bold;

  border-radius: 17px;

  background: #f3f8f9;

  overflow-wrap: anywhere;
}


.sentence-actions {

  display: flex;

  gap: 10px;

  margin-top: 12px;
}


.sentence-actions button {

  flex: 1;

  border: none;

  border-radius: 16px;

  padding: 15px;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;
}


.speak-button {

  background: #00a884;

  color: white;
}


.clear-button {

  background: #eeeeee;

  color: #222;
}


/* =========================
   SEARCH
========================= */

.search-box {

  margin-bottom: 12px;
}


.search-box input {

  width: 100%;

  border: none;

  outline: none;

  padding: 16px;

  border-radius: 18px;

  font-size: 17px;

  background: white;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.06);
}


/* =========================
   CATEGORIES
========================= */

.categories {

  display: flex;

  gap: 8px;

  overflow-x: auto;

  padding-bottom: 14px;
}


.categories button {

  white-space: nowrap;

  border: none;

  border-radius: 15px;

  padding: 12px 16px;

  background: white;

  font-size: 15px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.06);

  cursor: pointer;
}


/* =========================
   AAC GRID
========================= */

.aac-grid {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 12px;
}


.symbol {

  position: relative;

  min-height: 150px;

  border: none;

  border-radius: 22px;

  background: white;

  box-shadow:
    0 5px 16px
    rgba(0,0,0,.08);

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 9px;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;

  transition:
    transform .12s,
    box-shadow .12s,
    background .15s;

  padding: 10px 6px;
}


.symbol:active {

  transform: scale(.93);
}


.symbol.is-favorite {

  background: #fff8e7;

  box-shadow: 0 5px 18px rgba(255, 179, 0, 0.25);
}


.symbol-emoji {

  font-size: 52px;

  line-height: 1;
}


.symbol-title {

  text-align: center;

  line-height: 1.25;
}


.fav-badge {

  position: absolute;

  top: 8px;

  left: 10px;

  font-size: 16px;
}


/* =========================
   QUICK ACTIONS
========================= */

.quick-actions {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

  margin-top: 18px;
}


.quick-actions button {

  border: none;

  padding: 15px;

  border-radius: 16px;

  background: white;

  font-size: 15px;

  font-weight: bold;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.06);

  cursor: pointer;

  transition: transform .1s;
}


.quick-actions button:active {

  transform: scale(0.96);
}


.quick-actions button:first-child {

  background: #ffebee;

  color: #c62828;
}


.hint {

  text-align: center;

  font-size: 13px;

  color: #65727b;

  margin: 0 0 12px;

  opacity: 0.9;
}


/* =========================
   EMPTY
========================= */

.empty {

  grid-column: 1 / -1;

  text-align: center;

  background: white;

  padding: 30px;

  border-radius: 20px;

  font-size: 18px;
}


/* =========================
   FOOTER
========================= */

footer {

  text-align: center;

  padding: 25px;

  color: #65727b;
}


/* =========================
   ACCESSIBILITY
========================= */

button:focus-visible,
input:focus-visible {

  outline:
    3px solid #ffb300;

  outline-offset: 3px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .aac-grid {

    grid-template-columns:
      repeat(2, 1fr);
  }

  .quick-actions {

    grid-template-columns: 1fr;
  }

  .symbol {

    min-height: 145px;
  }

  .sentence {

    font-size: 22px;
  }

  .header h1 {

    font-size: 24px;
  }
}


/* =========================
   TABLET / DESKTOP
========================= */

@media (min-width: 1000px) {

  .aac-grid {

    grid-template-columns:
      repeat(5, 1fr);
  }
}

</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <div class="logo">💎</div>
    <div>
      <h1>نگین AAC</h1>
      <p>هر کودک، یک صدا؛ هر صدا، یک نگین</p>
    </div>
  </div>
  <button id="langSwitch" class="lang-btn" onclick="switchLanguage()" aria-label="تغییر زبان">
    پښتو
  </button>
</header>

<main class="container">
  <section class="status-card">
    <span id="connectionStatus">🟢 آماده</span>
    <span>نسخه 1.1</span>
  </section>

  <section class="sentence-box">
    <div id="sentence" class="sentence" aria-live="polite">جمله خود را بسازید</div>
    <div class="sentence-actions">
      <button onclick="speakSentence()" class="speak-button">🔊 پخش</button>
      <button onclick="clearSentence()" class="clear-button">🗑️ پاک</button>
    </div>
  </section>

  <section class="search-box">
    <input id="searchInput" type="search" placeholder="🔎 جستجوی کلمه..." oninput="searchSymbols()" aria-label="جستجوی کلمه">
  </section>

  <section class="categories" aria-label="دسته‌بندی‌ها">
    <button onclick="filterCategory('all')">🏠 همه</button>
    <button onclick="filterCategory('drinks')">💧 نوشیدنی</button>
    <button onclick="filterCategory('food')">🍎 غذا</button>
    <button onclick="filterCategory('people')">👨‍👩‍👧 افراد</button>
    <button onclick="filterCategory('needs')">🚻 نیازها</button>
    <button onclick="filterCategory('feelings')">😊 احساسات</button>
    <button onclick="filterCategory('health')">🩺 سلامت</button>
    <button onclick="filterCategory('places')">📍 مکان‌ها</button>
  </section>

  <p class="hint">نکته: برای افزودن به علاقه‌مندی‌ها، روی کلمه دوبار لمس کنید.</p>

  <section id="aacGrid" class="aac-grid" aria-label="واژه‌های ارتباطی"></section>

  <section class="quick-actions">
    <button onclick="showEmergency()">🚨 کمک فوری</button>
    <button onclick="showFavorites()">⭐ علاقه‌مندی‌ها</button>
    <button onclick="showRecent()">🕘 اخیر</button>
  </section>
</main>

<footer>
  <p>💎 مرکز آموزشی نگین</p>
  <small>Negin AAC • دری / پښتو</small>
</footer>

<script>

let currentLang = localStorage.getItem("neginLang") || "dari";

function t(key) {

}


/* =========================

========================= */

const symbols = [

/* =========================
   STATE
========================= */

let sentence = [];
let currentCategory = "all";

function loadList(key) {
  try {
    return JSON.parse(localStorage.getItem(key) || "[]");
  } catch {
    return [];
  }
}

function saveList(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

let favorites = loadList("neginFavorites");
let recent = loadList("neginRecent");


/* =========================
   HELPERS
========================= */

function getTitle(symbol) {
  return currentLang === "pashto" ? symbol.pashto : symbol.dari;
}


/* =========================
   UI UPDATE (Language)
========================= */

function updateUILanguage() {
  const h1 = document.querySelector(".header h1");
  const tagline = document.querySelector(".header p");
  if (h1) h1.textContent = t("appName");
  if (tagline) tagline.textContent = t("tagline");

  updateConnection();
  const versionEl = document.querySelector(".status-card span:last-child");
  if (versionEl) versionEl.textContent = t("version");

  if (sentence.length === 0) {
    const sent = document.getElementById("sentence");
    if (sent) sent.textContent = t("sentencePlaceholder");
  }

  const speakBtn = document.querySelector(".speak-button");
  const clearBtn = document.querySelector(".clear-button");
  if (speakBtn) speakBtn.textContent = t("speak");
  if (clearBtn) clearBtn.textContent = t("clear");

  const searchInput = document.getElementById("searchInput");
  if (searchInput) searchInput.placeholder = t("searchPlaceholder");

  const catButtons = document.querySelectorAll(".categories button");
  const catKeys = ["all", "drinks", "food", "people", "needs", "feelings", "health", "places"];
  catButtons.forEach((btn, i) => {
    if (catKeys[i]) btn.textContent = t(catKeys[i]);
  });

  const hint = document.querySelector(".hint");
  if (hint) hint.textContent = t("hint");

  const quickBtns = document.querySelectorAll(".quick-actions button");
  if (quickBtns[0]) quickBtns[0].textContent = t("emergency");
  if (quickBtns[1]) quickBtns[1].textContent = t("favorites");
  if (quickBtns[2]) quickBtns[2].textContent = t("recent");

  const footerP = document.querySelector("footer p");
  if (footerP) footerP.textContent = t("footer");

  const langBtn = document.getElementById("langSwitch");
  if (langBtn) langBtn.textContent = t("langSwitch");

  document.documentElement.lang = currentLang === "pashto" ? "ps" : "fa";
}


/* =========================
   LANGUAGE SWITCH
========================= */

function switchLanguage() {
  currentLang = currentLang === "dari" ? "pashto" : "dari";
  localStorage.setItem("neginLang", currentLang);
  sentence = [];
  updateSentence();
  updateUILanguage();
  searchSymbols();
}


/* =========================
   RENDER
========================= */

function renderSymbols(list) {
  list = list || symbols;
  const grid = document.getElementById("aacGrid");
  if (!grid) return;
  grid.innerHTML = "";

  if (list.length === 0) {
    grid.innerHTML = '<div class="empty">' + t("noWord") + '</div>';
    return;
  }

  list.forEach(function(symbol) {
    const isFavorite = favorites.some(function(item) { return item.id === symbol.id; });
    const title = getTitle(symbol);

    const button = document.createElement("button");
    button.className = "symbol" + (isFavorite ? " is-favorite" : "");
    button.type = "button";
    button.setAttribute("aria-label", title);

    button.innerHTML =
      '<span class="symbol-emoji" aria-hidden="true">' + symbol.emoji + '</span>' +
      '<span class="symbol-title">' + title + '</span>' +
      (isFavorite ? '<span class="fav-badge" aria-hidden="true">⭐</span>' : '');

    var lastTap = 0;
    button.addEventListener("click", function(e) {
      var now = Date.now();
      if (now - lastTap < 350) {
        e.preventDefault();
        toggleFavorite(symbol);
        renderSymbols(getFilteredList());
      } else {
        addWord(symbol);
      }
      lastTap = now;
    });

    grid.appendChild(button);
  });
}


function getFilteredList() {
  var input = document.getElementById("searchInput");
  var query = (input ? input.value.trim().toLowerCase() : "");
  var list = symbols;

  if (currentCategory !== "all") {
    list = list.filter(function(s) { return s.category === currentCategory; });
  }

  if (query) {
    list = list.filter(function(s) {
      return getTitle(s).toLowerCase().indexOf(query) !== -1;
    });
  }

  return list;
}


/* =========================
   ADD WORD
========================= */

function addWord(symbol) {
  var title = getTitle(symbol);
  sentence.push(title);
  updateSentence();
  speak(title);
  addRecent(symbol);
}


function updateSentence() {
  var element = document.getElementById("sentence");
  if (!element) return;
  if (sentence.length === 0) {
    element.textContent = t("sentencePlaceholder");
    return;
  }
  element.textContent = sentence.join(" ");
}


/* =========================
   TEXT TO SPEECH
========================= */

function speak(text) {
  if (!("speechSynthesis" in window)) {
    alert("دستگاه شما از پخش صدا پشتیبانی نمی‌کند.");
    return;
  }

  speechSynthesis.cancel();

  var utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = t("ttsLang");
  utterance.rate = 0.78;
  utterance.pitch = 1.05;
  utterance.volume = 1;

  var voices = speechSynthesis.getVoices();
  var preferred = null;

  if (currentLang === "pashto") {
    preferred = voices.find(function(v) {
      return v.lang.indexOf("ps") === 0 ||
             (v.name && v.name.toLowerCase().indexOf("pashto") !== -1);
    });
    if (!preferred) {
      preferred = voices.find(function(v) {
        return v.lang.indexOf("fa") === 0 || v.lang.indexOf("ar") === 0;
      });
    }
  } else {
    preferred = voices.find(function(v) {
      return v.lang.indexOf("fa") === 0 ||
             (v.name && (v.name.indexOf("Persian") !== -1 || v.name.indexOf("Farsi") !== -1));
    });
  }

  if (preferred) utterance.voice = preferred;
  speechSynthesis.speak(utterance);
}


function speakSentence() {
  if (sentence.length === 0) return;
  speak(sentence.join(" "));
}


function clearSentence() {
  sentence = [];
  updateSentence();
}


/* =========================
   CATEGORY & SEARCH
========================= */

function filterCategory(category) {
  currentCategory = category;
  var input = document.getElementById("searchInput");
  if (input) input.value = "";
  searchSymbols();
}


function searchSymbols() {
  renderSymbols(getFilteredList());
}


/* =========================
   FAVORITES
========================= */

function toggleFavorite(symbol) {
  var exists = favorites.some(function(item) { return item.id === symbol.id; });
  if (exists) {
    favorites = favorites.filter(function(item) { return item.id !== symbol.id; });
  } else {
    favorites.push(symbol);
  }
  saveList("neginFavorites", favorites);
}


function showFavorites() {
  if (favorites.length === 0) {
    alert(t("noFavorites"));
    return;
  }
  currentCategory = "all";
  var input = document.getElementById("searchInput");
  if (input) input.value = "";
  renderSymbols(favorites);
}


/* =========================
   RECENT
========================= */

function addRecent(symbol) {
  recent = recent.filter(function(item) { return item.id !== symbol.id; });
  recent.unshift(symbol);
  recent = recent.slice(0, 12);
  saveList("neginRecent", recent);
}


function showRecent() {
  if (recent.length === 0) {
    alert(t("noRecent"));
    return;
  }
  currentCategory = "all";
  var input = document.getElementById("searchInput");
  if (input) input.value = "";
  renderSymbols(recent);
}


/* =========================
   EMERGENCY
========================= */

function showEmergency() {
  sentence = t("emergencySentence").slice();
  updateSentence();
  speak(t("emergencySpeak"));
}


/* =========================
   CONNECTION
========================= */

function updateConnection() {
  var element = document.getElementById("connectionStatus");
  if (!element) return;
  element.textContent = navigator.onLine ? t("online") : t("offline");
}

window.addEventListener("online", updateConnection);
window.addEventListener("offline", updateConnection);


/* =========================
   SERVICE WORKER
========================= */

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("sw.js").catch(function(err) {
      console.log("Service Worker:", err);
    });
  });
}


if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = function() {};
}


/* =========================
   START
========================= */

updateUILanguage();
renderSymbols();
updateConnection();

</script>
</body>
</html>
